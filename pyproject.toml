[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "persian-ocr-pipeline"
version = "0.1.0"
description = "Local-first modular Persian (RTL) document OCR pipeline"
requires-python = ">=3.10,<3.12"
dependencies = [
    "paddleocr[doc-parser]>=3.3.0,<4",
    "pypdfium2>=4.30.0",
    "opencv-python-headless>=4.9.0",
    "Pillow>=10.0.0",
    "numpy>=1.26.0,<2.3",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "typer>=0.12.0",
    "huggingface-hub>=0.25.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
nemotron = [
    "torch>=2.7.0,<2.8",
    "torchvision>=0.22.0,<0.23",
    "timm>=1.0.20",
    "transformers>=5.0.0",
    "accelerate>=1.0.0",
]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
persian-ocr = "src.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["config*", "src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
